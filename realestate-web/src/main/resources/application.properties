# ===================================================================
# 后端服务配置
# ===================================================================

spring.application.name=realestate-web
server.port=8080

# --------------------------------------------------------------- 数据库
# 数据库连接不写在这里。core 的 dao 层需要一份能同时服务桌面端与网页端的配置，
# 所以真相仍在 db.properties（不入库），由 web/config/CoreIntegrationConfig
# 读出来构造 HikariCP 连接池，再交给 core 的 DatabaseUtil。
# 覆盖优先级：系统属性（-Ddb.url=...）> 环境变量（DB_URL）> db.properties。
# 详见 realestate-core/src/main/java/util/AppConfig.java。

# --------------------------------------------------------------- 跨域
# 开发期前端经 Vite 代理访问后端（见 frontend/vite.config.js），从浏览器看是同源，
# 不需要 CORS。仅当前端与后端真的不同源时才需要开启，例如前端用 nginx 单独托管。
# 默认关闭；开启示例（逗号分隔多个来源）：
#   app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# ----------------------------------------------------------- 接口文档
# Swagger UI：http://localhost:8080/swagger-ui/index.html
# OpenAPI JSON：http://localhost:8080/v3/api-docs
#
# 显式写出 true 有两个好处：
#   ① springdoc 只在「属性缺席」时才打印那条「默认开启，生产环境请关掉」的警告，
#      写清楚就没有这条噪音了；
#   ② 对外部署时改成 false（或设环境变量 APP_API_DOCS=false）即可整体关掉，
#      不必改代码。文档本身不含数据，但仍应避免暴露接口清单给公网。
springdoc.api-docs.enabled=${APP_API_DOCS:true}
springdoc.swagger-ui.enabled=${APP_API_DOCS:true}
